<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'"
    />
    <title>Audii</title>
  </head>
  <body>
    <div class="splash" id="splash">
      <div class="halo" aria-hidden="true"></div>

      <div class="mark">
        <div class="ring" aria-hidden="true"></div>
        <div class="tile">
          <!-- Monogramme « Au » — tracé identique à Icons.tsx et gen-icons.mjs. -->
          <svg viewBox="0 0 915 796" width="92" height="80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="splash-mark" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#FDB44B" />
                <stop offset="1" stop-color="#F85C60" />
              </linearGradient>
              <linearGradient id="splash-dot" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#F0007A" />
                <stop offset="1" stop-color="#8E00AE" />
              </linearGradient>
            </defs>
            <g stroke="url(#splash-mark)" stroke-width="135">
              <path d="M67.5 796V302.5a235 235 0 0 1 470 0V575a153.5 153.5 0 0 0 307 0V463.5" />
              <path d="M262.5 531h275" />
            </g>
            <circle cx="844.5" cy="330" r="67.5" fill="url(#splash-dot)" />
          </svg>
        </div>
      </div>

      <h1 class="wordmark">
        <span style="--i: 0">A</span><span style="--i: 1">U</span><span style="--i: 2">D</span><span style="--i: 3"
          >I</span
        ><span style="--i: 4">I</span>
      </h1>
      <p class="tagline">Le bon tempo, au bon moment.</p>

      <div class="equalizer" aria-hidden="true">
        <i style="--d: 0s"></i><i style="--d: 0.12s"></i><i style="--d: 0.24s"></i><i style="--d: 0.36s"></i
        ><i style="--d: 0.48s"></i><i style="--d: 0.6s"></i><i style="--d: 0.72s"></i><i style="--d: 0.84s"></i
        ><i style="--d: 0.96s"></i>
      </div>

      <div class="progress"><div class="progress-fill" id="fill"></div></div>
      <p class="status" id="status">Initialisation…</p>

      <footer class="credit">Propulsé par <strong>Buyticle</strong></footer>
    </div>

    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
