name: Build Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Vérifie sur Linux (avec écran virtuel) que l'application démarre, scanne
  # une vraie bibliothèque audio, lit un fichier et estime son tempo.
  smoke:
    name: Test de fumée (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - run: npm run build

      - name: Génération d'une bibliothèque de test
        run: node scripts/make-fixtures.mjs "$HOME/Music"

      - name: Lancement de l'application
        env:
          AUDII_SMOKE: ${{ github.workspace }}/smoke
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npx electron . --no-sandbox

      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-smoke
          path: smoke/
          if-no-files-found: warn

  windows:
    name: Paquet Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilation (main + preload + renderer)
        env:
          # Scelle la clé du modèle dans le binaire. Secret absent = phrases
          # locales uniquement, ce qui reste un fonctionnement complet.
          AUDII_GROQ_KEY: ${{ secrets.AUDII_GROQ_KEY }}
        run: npm run build

      - name: Empaquetage electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      # Le poids se discute sur des chiffres, pas sur des impressions : on
      # mesure ce que l'utilisateur télécharge et ce qui reste sur son disque.
      - name: Poids du paquet
        run: |
          $dossier = (Get-ChildItem release\win-unpacked -Recurse -File |
            Measure-Object -Property Length -Sum).Sum
          Write-Host ("Installé (x64) : {0:N0} Mo" -f ($dossier / 1MB))
          Get-ChildItem release\*.exe | Sort-Object Length | ForEach-Object {
            Write-Host ("{0,-40} {1,8:N0} Mo" -f $_.Name, ($_.Length / 1MB))
          }

      # Le paquet Linux était vérifié, pas le binaire Windows : on lance
      # réellement l'exécutable empaqueté avant de publier quoi que ce soit.
      - name: Génération d'une bibliothèque de test
        run: node scripts/make-fixtures.mjs "$env:USERPROFILE\Music"

      - name: Lancement du binaire Windows empaqueté
        env:
          AUDII_SMOKE: ${{ github.workspace }}\smoke-win
        run: |
          $exe = "release\win-unpacked\Audii.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem release -Recurse -Depth 2 | Select-Object FullName
            throw "$exe introuvable dans le paquet"
          }
          Write-Host "Taille : $((Get-Item $exe).Length) octets"
          $process = Start-Process -FilePath $exe -PassThru -Wait
          $log = "$env:AUDII_SMOKE\smoke.log"
          if (Test-Path $log) { Get-Content $log }
          Write-Host "Code de sortie : $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "l'application empaquetée a échoué" }

      # Vérifier `win-unpacked` ne prouve rien sur l'installateur : c'est un
      # artefact voisin, pas celui que l'utilisateur exécute. Un installateur
      # peut poser son désinstalleur et ses raccourcis sans jamais extraire
      # l'application — le dossier ne contient alors qu'Uninstall.exe et le
      # raccourci ne mène nulle part. On installe donc pour de vrai, on
      # inventorie le dossier, et on lance l'application installée.
      - name: Installation réelle et lancement de l'application installée
        env:
          AUDII_SMOKE: ${{ github.workspace }}\smoke-install
        run: |
          $setup = Get-ChildItem release\Audii-Setup-*-x64.exe | Select-Object -First 1
          if (-not $setup) { throw "installateur x64 introuvable" }
          Write-Host "Installateur : $($setup.Name)"

          # `/S` = mode silencieux NSIS. `perMachine: false` installe pour
          # l'utilisateur courant, donc sous %LOCALAPPDATA%\Programs.
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          Write-Host "Code de sortie de l'installateur : $($install.ExitCode)"

          $cible = "$env:LOCALAPPDATA\Programs\Audii"
          if (-not (Test-Path $cible)) {
            Write-Host "::error::$cible n'existe pas — rien n'a été installé"
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue |
              Select-Object FullName
            throw "dossier d'installation absent"
          }

          Write-Host "--- contenu de $cible ---"
          $fichiers = Get-ChildItem $cible -Recurse -File
          $fichiers | Sort-Object Length -Descending | Select-Object -First 12 |
            ForEach-Object { Write-Host ("{0,10:N0} o  {1}" -f $_.Length, $_.FullName.Replace($cible, '')) }
          Write-Host ("--- {0} fichier(s), {1:N0} Mo au total ---" -f $fichiers.Count,
            (($fichiers | Measure-Object -Property Length -Sum).Sum / 1MB))

          $exe = Join-Path $cible 'Audii.exe'
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Audii.exe absent : l'installateur n'a pas extrait l'application"
            throw "application non extraite"
          }

          # Le raccourci du menu Démarrer doit pointer sur un fichier existant.
          $raccourci = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Audii.lnk"
          if (Test-Path $raccourci) {
            $cible2 = (New-Object -ComObject WScript.Shell).CreateShortcut($raccourci).TargetPath
            Write-Host "Raccourci -> $cible2"
            if (-not (Test-Path $cible2)) { throw "le raccourci ne mène nulle part : $cible2" }
          } else {
            Write-Host "::warning::raccourci du menu Démarrer introuvable"
          }

          $process = Start-Process -FilePath $exe -PassThru -Wait
          $log = "$env:AUDII_SMOKE\smoke.log"
          if (Test-Path $log) { Get-Content $log }
          Write-Host "Code de sortie : $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "l'application installée a échoué" }

      # Le runner est en x64 : l'installateur ARM64 doit y refuser de
      # s'installer, et le dire. Sans ce garde-fou il « réussissait » en
      # ne posant qu'un désinstalleur et un raccourci mort.
      - name: L'installateur ARM64 refuse une machine x64
        run: |
          $setup = Get-ChildItem release\Audii-Setup-*-arm64.exe | Select-Object -First 1
          if (-not $setup) { throw "installateur ARM64 introuvable" }

          $avant = Get-ChildItem "$env:LOCALAPPDATA\Programs\Audii" -Recurse -File -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          Write-Host "Code de sortie : $($install.ExitCode)"
          if ($install.ExitCode -eq 0) {
            throw "l'installateur ARM64 s'est déclaré satisfait sur une machine x64"
          }

          # Et il ne doit pas avoir touché à l'installation x64 en place.
          $apres = Get-ChildItem "$env:LOCALAPPDATA\Programs\Audii" -Recurse -File -ErrorAction SilentlyContinue
          if ($apres.Count -ne $avant.Count) {
            throw "l'installation existante a été modifiée ($($avant.Count) -> $($apres.Count) fichiers)"
          }
          Write-Host "Refus correct, installation x64 intacte ($($apres.Count) fichiers)"

      - name: Captures Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-windows
          path: smoke-win/
          if-no-files-found: warn

      # Un artefact par fichier, et non un paquet des trois architectures :
      # GitHub ne sait pas donner de lien vers un fichier *dans* un artefact,
      # donc tout regrouper obligeait à télécharger 328 Mo pour en installer
      # 82. Chaque téléchargement ne contient plus que ce qu'on a demandé.
      - name: Installateur x64
        uses: actions/upload-artifact@v4
        with:
          name: Audii-Setup-x64
          path: release/Audii-Setup-*-x64.exe
          if-no-files-found: error

      - name: Installateur ARM64
        uses: actions/upload-artifact@v4
        with:
          name: Audii-Setup-arm64
          path: release/Audii-Setup-*-arm64.exe
          if-no-files-found: error

      # Le fichier sans suffixe d'architecture : il porte les deux, donc il
      # pèse le double. Utile seulement quand on ignore la machine cible.
      # Désigné par exclusion plutôt que par un motif de version, qui casserait
      # au premier numéro à deux chiffres.
      - name: Installateur universel
        uses: actions/upload-artifact@v4
        with:
          name: Audii-Setup-universel
          path: |
            release/Audii-Setup-*.exe
            !release/Audii-Setup-*-x64.exe
            !release/Audii-Setup-*-arm64.exe
          if-no-files-found: error

      - name: Portable x64
        uses: actions/upload-artifact@v4
        with:
          name: Audii-Portable-x64
          path: release/Audii-*-x64-portable.exe
          if-no-files-found: error

      - name: Portable ARM64
        uses: actions/upload-artifact@v4
        with:
          name: Audii-Portable-arm64
          path: release/Audii-*-arm64-portable.exe
          if-no-files-found: error

      - name: Portable universel
        uses: actions/upload-artifact@v4
        with:
          name: Audii-Portable-universel
          path: |
            release/Audii-*-portable.exe
            !release/Audii-*-x64-portable.exe
            !release/Audii-*-arm64-portable.exe
          if-no-files-found: error

  release:
    name: Publication (tag v*)
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true
