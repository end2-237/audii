appId: com.buyticle.audii
productName: Audii
copyright: © ${author} — Audii

directories:
  output: release
  buildResources: build

# Tout est bundlé par esbuild/Vite : le paquet ne contient que dist/.
files:
  - dist/**/*
  - package.json

asar: true
compression: normal

win:
  icon: build/icon.ico
  # Deux architectures : un binaire x64 ne démarre pas sur un PC ARM64, et
  # Windows y répond par « cette application ne peut pas s'exécuter sur votre
  # PC ». L'architecture figure dans le nom du fichier pour ne pas se tromper.
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Audii
  # Raccourci à la racine du menu Démarrer, sans sous-dossier : c'est le
  # chemin que l'installateur ouvre en fin de parcours, et un sous-dossier
  # le rendait ambigu.
  menuCategory: false
  # La case « lancer Audii » de la dernière page ouvrait le raccourci du menu
  # Démarrer plutôt que l'exécutable, ce que Windows refusait
  # (« ce fichier ne contient pas d'application associée »). L'installation
  # elle-même n'était pas en cause ; on retire simplement ce lancement.
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  requestExecutionLevel: user

mac:
  icon: build/icon.png
  category: public.app-category.music
  target:
    - dmg
    - zip

linux:
  icon: build/icon.png
  category: AudioVideo
  target:
    - AppImage
